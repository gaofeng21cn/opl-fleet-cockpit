name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Require tag and package version parity
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: ./ops/synology/deploy.test.sh
      - run: ./ops/synology/gateway-brand-migration.test.sh
      - run: npm run build
      - run: npm run build:android
      - run: ./ops/docker/smoke-test.sh
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Qualify unsigned Android release code
        run: |
          ./android-kiosk/gradlew \
            -p android-kiosk \
            :app:testReleaseUnsignedUnitTest \
            :app:assembleReleaseUnsigned

  docker:
    needs: [validate, android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ambient-ops-android-release
          path: kiosk-release
      - name: Verify embedded kiosk release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { KioskReleaseStore } from "./server/kiosk-release.mjs";
          const releases = new KioskReleaseStore("./kiosk-release");
          await releases.load();
          if (!releases.manifest) {
            throw new Error("Signed kiosk release is missing");
          }
          process.stdout.write(
            `Embedding kiosk ${releases.manifest.versionName} (${releases.manifest.versionCode})\n`,
          );
          NODE
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gaofeng21cn/opl-fleet-cockpit:${{ steps.version.outputs.value }}
            ghcr.io/gaofeng21cn/opl-fleet-cockpit:latest
            ghcr.io/gaofeng21cn/ambient-ops:${{ steps.version.outputs.value }}
            ghcr.io/gaofeng21cn/ambient-ops:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:android
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Require Android release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || {
              echo "A required Android release signing secret is missing." >&2
              exit 1
            }
          done
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ambient-ops-release.p12"
      - name: Build signed Android release
        env:
          AMBIENT_OPS_ANDROID_KEYSTORE: ${{ runner.temp }}/ambient-ops-release.p12
          AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD }}
          AMBIENT_OPS_ANDROID_KEY_ALIAS: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_ALIAS }}
          AMBIENT_OPS_ANDROID_KEY_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_PASSWORD }}
        run: |
          ./android-kiosk/gradlew \
            -p android-kiosk \
            :app:testReleaseUnitTest \
            :app:assembleRelease
      - name: Verify and package signed APK
        id: apk
        env:
          EXPECTED_CERT_SHA256: 4e5f5732645986e5a861446028846fcfb571b9dd006d87da19aa60f152639206
        shell: bash
        run: |
          apk="android-kiosk/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256" || {
            echo "Android signing certificate does not match the established upgrade key." >&2
            exit 1
          }
          metadata="android-kiosk/app/build/outputs/apk/release/output-metadata.json"
          test -f "$metadata" || {
            echo "Android Gradle output metadata is missing." >&2
            exit 1
          }
          node --input-type=module - "$metadata" "$apk" \
            > "$RUNNER_TEMP/kiosk-apk-metadata.tsv" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { basename } from "node:path";

          const [metadataPath, apkPath] = process.argv.slice(2);
          const metadata = JSON.parse(await readFile(metadataPath, "utf8"));
          if (metadata.applicationId !== "cn.gaofeng.ambientops.kiosk") {
            throw new Error(`Unexpected applicationId: ${metadata.applicationId}`);
          }
          if (!Array.isArray(metadata.elements) || metadata.elements.length !== 1) {
            throw new Error("Expected exactly one Android release artifact");
          }
          const [artifact] = metadata.elements;
          if (artifact.outputFile !== basename(apkPath)) {
            throw new Error(
              `Gradle metadata points to ${artifact.outputFile}, not ${basename(apkPath)}`,
            );
          }
          if (!Number.isSafeInteger(artifact.versionCode) || artifact.versionCode <= 0) {
            throw new Error(`Invalid versionCode: ${artifact.versionCode}`);
          }
          if (!/^[a-zA-Z0-9._-]{1,40}$/.test(artifact.versionName)) {
            throw new Error(`Invalid versionName: ${artifact.versionName}`);
          }
          process.stdout.write(`${artifact.versionCode}\t${artifact.versionName}\n`);
          NODE
          IFS=$'\t' read -r version_code version_name \
            < "$RUNNER_TEMP/kiosk-apk-metadata.tsv"
          artifact="Ambient-Ops-Kiosk-${version_name}.apk"
          cp "$apk" "$artifact"
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          printf '%s  %s\n' "$artifact_sha256" "$artifact" > "${artifact}.sha256"
          node - \
            "$version_code" \
            "$version_name" \
            "$artifact" \
            "$artifact_sha256" \
            "$EXPECTED_CERT_SHA256" \
            > kiosk-update.json <<'NODE'
          const [versionCode, versionName, artifact, sha256, signerSha256] =
            process.argv.slice(2);
          process.stdout.write(
            `${JSON.stringify({
              versionCode: Number(versionCode),
              versionName,
              artifact,
              sha256,
              signerSha256,
            }, null, 2)}\n`,
          );
          NODE
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ambient-ops-android-release
          path: |
            ${{ steps.apk.outputs.artifact }}
            ${{ steps.apk.outputs.artifact }}.sha256
            kiosk-update.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [docker, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ambient-ops-android-release
          path: release-assets
      - name: Record immutable Docker image
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
        shell: bash
        run: |
          printf '%s\n' \
            "ghcr.io/gaofeng21cn/opl-fleet-cockpit:${IMAGE_VERSION}" \
            "ghcr.io/gaofeng21cn/opl-fleet-cockpit@${IMAGE_DIGEST}" \
            "ghcr.io/gaofeng21cn/ambient-ops:${IMAGE_VERSION}" \
            "ghcr.io/gaofeng21cn/ambient-ops@${IMAGE_DIGEST}" \
            > "release-assets/OPL-Fleet-Cockpit-Gateway-Docker-${IMAGE_VERSION}.txt"
          (
            cd release-assets
            sha256sum Ambient-Ops-* OPL-Fleet-Cockpit-* kiosk-update.json > SHA256SUMS
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPL Fleet Cockpit $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
