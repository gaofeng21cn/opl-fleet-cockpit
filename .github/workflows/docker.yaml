name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/docker.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose*.yaml"
      - "ops/docker/**"
      - "ops/synology/**"
      - "package*.json"
      - "public/**"
      - "server/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose*.yaml"
      - "ops/docker/**"
      - "ops/synology/**"
      - "package*.json"
      - "public/**"
      - "server/**"
      - "src/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./ops/synology/deploy.test.sh
      - run: ./ops/synology/gateway-brand-migration.test.sh
