plugins {
    id "com.android.application"
}

def releaseSigning = [
    storeFile: System.getenv("AMBIENT_OPS_ANDROID_KEYSTORE"),
    storePassword: System.getenv("AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("AMBIENT_OPS_ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("AMBIENT_OPS_ANDROID_KEY_PASSWORD"),
]
def releaseSigningVariableNames = [
    storeFile: "AMBIENT_OPS_ANDROID_KEYSTORE",
    storePassword: "AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD",
    keyAlias: "AMBIENT_OPS_ANDROID_KEY_ALIAS",
    keyPassword: "AMBIENT_OPS_ANDROID_KEY_PASSWORD",
]
def missingReleaseSigningVariables = releaseSigning.findAll { key, value ->
    value == null || value.trim().isEmpty()
}.keySet().collect { releaseSigningVariableNames[it] }
def releaseKeystoreFile =
    releaseSigning.storeFile == null || releaseSigning.storeFile.trim().isEmpty()
        ? null
        : file(releaseSigning.storeFile)
def releaseSigningReady =
    missingReleaseSigningVariables.isEmpty()
        && releaseKeystoreFile != null
        && releaseKeystoreFile.isFile()
def productVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
def productBuild = new groovy.json.JsonSlurper().parse(rootProject.file("product-build.json"))
if (productBuild.version != productVersion) {
    throw new GradleException("Run node scripts/prepare-product-release.mjs before packaging")
}
def ambientOpsVersionCode = providers.gradleProperty("ambientOpsVersionCode").getOrElse(productBuild.versionCode.toString()).toInteger()
def ambientOpsVersionName = productVersion

android {
    namespace "cn.gaofeng.ambientops.kiosk"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "cn.gaofeng.ambientops.kiosk"
        minSdk 28
        targetSdk 35
        versionCode ambientOpsVersionCode
        versionName ambientOpsVersionName
    }

    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        releaseUnsigned {
            initWith release
            signingConfig null
            matchingFallbacks = ["release"]
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}

gradle.taskGraph.whenReady { graph ->
    def signedReleaseArtifactSelected = graph.allTasks.any { task ->
        if (task.project != project) {
            return false
        }
        def name = task.name.toLowerCase(Locale.ROOT)
        def createsReleaseArtifact =
            name.startsWith("assemble")
                || name.startsWith("bundle")
                || name.startsWith("install")
                || name.startsWith("package")
                || name.startsWith("sign")
                || name.startsWith("validate")
        return createsReleaseArtifact
            && name.contains("release")
            && !name.contains("releaseunsigned")
    }
    if (signedReleaseArtifactSelected && !releaseSigningReady) {
        def problem = missingReleaseSigningVariables.isEmpty()
            ? "AMBIENT_OPS_ANDROID_KEYSTORE does not point to a readable file"
            : "missing environment variables: " + missingReleaseSigningVariables.sort().join(", ")
        throw new GradleException(
            "Signed Android release requested, but signing is not configured (" + problem + "). "
                + "Use :app:assembleReleaseUnsigned for non-distributable qualification."
        )
    }
}
