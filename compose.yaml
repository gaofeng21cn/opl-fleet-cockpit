# This is the complete production definition. DSM Container Manager reads this
# file by itself, so LAN discovery must not depend on a second override file.
services:
  gateway:
    image: ${OPL_FLEET_COCKPIT_IMAGE:-${AMBIENT_OPS_IMAGE:-ghcr.io/gaofeng21cn/opl-fleet-cockpit:0.1.43}}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8787"
      DATA_DIR: /data
      DEMO_MODE: ${DEMO_MODE:-true}
      SITE_NAME: ${SITE_NAME:-OPL Fleet Cockpit}
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Asia/Shanghai}
      DISCOVERY_ENABLED: "true"
      INSTANCE_ID: ${INSTANCE_ID:-}
      AGENT_PUSH_TOKEN_FILE: /run/secrets/agent_push_token
      DEVICE_PAIRING_ENABLED: ${DEVICE_PAIRING_ENABLED:-true}
      UNIFI_BASE_URL: ${UNIFI_BASE_URL:-}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_API_KEY_FILE: /run/secrets/unifi_api_key
      UNIFI_ALLOW_SELF_SIGNED: ${UNIFI_ALLOW_SELF_SIGNED:-false}
      UNIFI_CA_FILE: ${UNIFI_CA_FILE:-}
      UNIFI_POLL_MS: ${UNIFI_POLL_MS:-250}
      UNIFI_RATE_WINDOW_MS: ${UNIFI_RATE_WINDOW_MS:-2000}
      UNIFI_SNMP_HOST: ${UNIFI_SNMP_HOST:-}
      UNIFI_SNMP_PORT: ${UNIFI_SNMP_PORT:-161}
      UNIFI_SNMP_USER: ${UNIFI_SNMP_USER:-}
      UNIFI_SNMP_AUTH_PASSWORD_FILE: /run/secrets/unifi_snmp_auth_password
      UNIFI_SNMP_PRIV_PASSWORD_FILE: /run/secrets/unifi_snmp_priv_password
      UNIFI_SNMP_AUTH_PROTOCOL: ${UNIFI_SNMP_AUTH_PROTOCOL:-sha}
      UNIFI_SNMP_PRIV_PROTOCOL: ${UNIFI_SNMP_PRIV_PROTOCOL:-aes}
      UNIFI_SNMP_INTERFACES: ${UNIFI_SNMP_INTERFACES:-}
      UNIFI_SNMP_CLIENT_INTERFACES: ${UNIFI_SNMP_CLIENT_INTERFACES:-}
      UNIFI_SNMP_TIMEOUT_MS: ${UNIFI_SNMP_TIMEOUT_MS:-3000}
      NETWORK_LATENCY_HOST: ${NETWORK_LATENCY_HOST:-}
      NETWORK_LATENCY_PORT: ${NETWORK_LATENCY_PORT:-443}
      NETWORK_LATENCY_TIMEOUT_MS: ${NETWORK_LATENCY_TIMEOUT_MS:-1500}
      NETWORK_AUXILIARY_POLL_MS: ${NETWORK_AUXILIARY_POLL_MS:-5000}
      LIVE_AFTER_SECONDS: ${LIVE_AFTER_SECONDS:-30}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-300}
      HA_ENABLED: ${HA_ENABLED:-false}
      HA_BASE_URL: ${HA_BASE_URL:-}
      HA_TOKEN_FILE: /run/secrets/ha_token
      HA_ENTITY_PREFIX: ${HA_ENTITY_PREFIX:-ambient_ops}
      HA_SYNC_MS: ${HA_SYNC_MS:-30000}
      HA_TIMEOUT_MS: ${HA_TIMEOUT_MS:-5000}
    volumes:
      - cockpit_data:/data
      - ./secrets:/run/secrets:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cockpit_data:
    # Existing installations set this to ambient-ops_ambient_ops_data during
    # the one-time identity migration. New installations use the branded name.
    name: ${OPL_FLEET_COCKPIT_DATA_VOLUME:-opl-fleet-cockpit_data}
