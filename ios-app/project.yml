name: OPLFleetCockpit
options:
  bundleIdPrefix: cn.gaofeng
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: SVVC4TA784
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages: {}
targets:
  OPLFleetCockpit:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
    info:
      path: Config/OPLFleetCockpit-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: OPL Cockpit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: OPL Fleet Cockpit discovers and reads aggregate status from your self-hosted OPL Fleet Telemetry Gateway on this local network.
        NSBonjourServices:
          # Current Gateway wire identity; retain until its separately deployed migration.
          - _ambient-ops._tcp
          - _opl-fleet-agent._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        CFBundleURLTypes:
          - CFBundleURLName: cn.gaofeng.oplfleetcockpit
            CFBundleURLSchemes:
              - oplfleetcockpit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    entitlements:
      path: Config/OPLFleetCockpit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.gaofeng.oplfleetcockpit
    dependencies:
      - target: OPLFleetCockpitWidgets
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: cn.gaofeng.oplfleetcockpit
        PRODUCT_NAME: OPLFleetCockpit
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OPL Cockpit App Store 2026
  OPLFleetCockpitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
    info:
      path: Config/OPLFleetCockpitWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: OPL Fleet Cockpit Widgets
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/OPLFleetCockpitWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.gaofeng.oplfleetcockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gaofeng.oplfleetcockpit.widgets
        PRODUCT_NAME: OPL Fleet Cockpit Widgets
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OPL Cockpit Widgets App Store 2026
  OPLFleetCockpitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OPLFleetCockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gaofeng.oplfleetcockpit.tests
        CODE_SIGNING_ALLOWED: false
schemes:
  OPLFleetCockpit:
    build:
      targets:
        OPLFleetCockpit: all
        OPLFleetCockpitWidgets: all
        OPLFleetCockpitTests: [test]
    test:
      targets:
        - OPLFleetCockpitTests
    run:
      config: Debug
    archive:
      config: Release
